name: Skills Validation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate 14 Skills and Prompts
        run: bash validate-skills.sh

      - name: Test Motion Router
        run: python skills/motion-director/scripts/test_route_motion.py

      - name: Test GPU Policy
        run: python skills/motion-director/scripts/test_gpu_policy.py

      - name: Test Browser GPU Probe
        run: node skills/motion-director/scripts/test_browser_gpu_probe.cjs

      - name: Test Video Review Loop
        run: python skills/video-review-loop/scripts/test_review_video.py
