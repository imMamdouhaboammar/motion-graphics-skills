name: Skills Validation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate 14 Skills and Prompts
        run: bash validate-skills.sh

      - name: Test Motion Work Guard
        run: python skills/motion-director/scripts/test_work_guard.py

      - name: Check Browser Readiness Probe
        run: |
          node --check skills/motion-director/scripts/browser-readiness-probe.cjs
          node skills/motion-director/scripts/browser-readiness-probe.cjs --help
