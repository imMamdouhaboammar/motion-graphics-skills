          return Promise.all(faces.concat(imgs)).then(function () { return document.fonts.ready; }).then(function () {
            var missing = ['400 40px Inter', '800 40px Inter', '500 40px JBMono'].filter(function (f) { return !document.fonts.check(f, 'Ae'); });
            if (missing.length) throw new Error('font missing: ' + missing.join(', '));
            return true;
          });
        }

        window.__ready = ready().then(function () {
          // mascots added by script must decode before the first frame too
          var crew = $('#e-crew'), ch = '';
          for (var i = 0; i < 12; i++) ch += '<img class="px" src="assets/img/mascots/m' + String(i).padStart(2, '0') + '.png" style="left:' + (101 + (i % 6) * 150) + 'px;top:' + (i < 6 ? 0 : 150) + 'px" alt="" />';
          crew.innerHTML = ch;
          SK.forEach(function (cfg, k) { buildSection(k, cfg); });
          return Promise.all($$('#s1 img, #s2 img, #s3 img, #s4 img, #s5 img, #e-crew img').map(function (im) {
            return im.decode().catch(function (e) { throw new Error('image failed to decode: ' + im.getAttribute('src') + ' (' + e + ')'); });
          }));
        }).then(function () {
          var tl = gsap.timeline({ paused: true });

          tl.fromTo('#pill', { opacity: 0, y: 30, xPercent: -50 }, { opacity: 1, y: 0, xPercent: -50, duration: 0.35, ease: 'back.out(1.7)' }, 0.2);

          /* ================= HOOK 0 to 4.385 ================= */
          $('#h-spark').innerHTML = sparkSVG('#e8664a', 13);
          $('#h-spark-b').innerHTML = sparkSVG('#3d3d3b', 11);
          tl.fromTo('#h-spark', { scale: 1.9, rotation: -60, x: -260, y: -380 }, { scale: 1, rotation: 0, x: 0, y: 0, duration: 0.7, ease: 'expo.out' }, 0.025);
          tl.fromTo('#h-spark', { rotation: 0 }, { rotation: 120, duration: 3.6, ease: 'none', immediateRender: false }, 0.725);
          tl.fromTo('#h-spark-b', { rotation: 0, x: 60 }, { rotation: -60, x: 0, duration: 4.4, ease: 'none' }, 0);
          tl.fromTo('#h-cam', { x: 260, y: 260, rotation: 44 }, { x: 0, y: 0, rotation: 30, duration: 1.2, ease: 'expo.out' }, 0.43);
          tl.fromTo('#h-cam', { y: 0, rotation: 30 }, { y: -40, rotation: 24, duration: 2.8, ease: 'none', immediateRender: false }, 1.63);
          tl.fromTo('#h-l1 .n', { opacity: 0, x: -120, filter: 'blur(16px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.45, ease: 'expo.out', immediateRender: false }, 0.025);
          $('#h-l1 .n').textContent = COUNT;
          lettersIn(tl, splitLetters($('#h-l1 .lw')), 0.409, 260, null, 0.35);
          lettersIn(tl, splitLetters($('#h-l2 .lw')), 1.363, 200, null, 0.4);
          var tag = $('#h-tag'), ttx = 'here are 5 to start with';
          $('.ty', tag).textContent = ttx; tag.style.width = tag.offsetWidth + 'px'; $('.ty', tag).textContent = '';
          tl.fromTo(tag, { opacity: 1, scaleX: 0, xPercent: -50 }, { opacity: 1, scaleX: 1, xPercent: -50, transformOrigin: '0% 50%', duration: 0.3, ease: 'expo.out', immediateRender: false }, 2.205);
          tl.set(tag, { xPercent: -50 }, 0);
          var tyo = { n: 0 };
          tl.fromTo(tyo, { n: 0 }, { n: ttx.length, duration: 1.0, ease: 'none', immediateRender: false, onUpdate: function () { $('.ty', tag).textContent = ttx.slice(0, Math.round(tyo.n)); } }, 2.3);

          /* ================= bursts frame every #N beat ================= */
          function bursts(B) {
            [['tr', 0], ['bl', 0.07]].forEach(function (p) {
              var b = document.createElement('div'); b.className = 'burst'; b.innerHTML = burstSVG();
              $('#fx').insertBefore(b, $('#flash'));
              var tr = p[0] === 'tr';
              var A = tr ? [1600, -600] : [-520, 2520], R1 = tr ? [1060, -10] : [20, 1930], R2 = tr ? [1000, 40] : [80, 1880], X = tr ? [1700, -700] : [-620, 2620];
              var at = B - 0.12 + p[1], sc = tr ? 0.95 : 0.85, rot = tr ? 1 : -1;
              tl.fromTo(b, { x: A[0], y: A[1], rotation: 0, scale: sc, opacity: 1 }, { x: R1[0], y: R1[1], rotation: 40 * rot, scale: sc, opacity: 1, duration: 0.38, ease: 'power3.out', immediateRender: false }, at);
              tl.fromTo(b, { x: R1[0], y: R1[1], rotation: 40 * rot }, { x: R2[0], y: R2[1], rotation: 70 * rot, duration: 1.0, ease: 'none', immediateRender: false }, at + 0.38);
              tl.fromTo(b, { x: R2[0], y: R2[1], rotation: 70 * rot }, { x: X[0], y: X[1], rotation: 120 * rot, duration: 0.36, ease: 'power2.in', immediateRender: false }, at + 1.38);
              tl.set(b, { opacity: 0 }, at + 1.75);
            });
          }

          /* radial blur flash between beats, as in the reference */
          function flash(at, layer) {
            tl.fromTo('#flash', { opacity: 0 }, { opacity: 0.85, duration: 0.16, ease: 'power2.out', immediateRender: false }, at);
            tl.fromTo('#flash', { opacity: 0.85 }, { opacity: 0, duration: 0.3, ease: 'power2.in', immediateRender: false }, at + 0.2);
            if (layer) tl.fromTo(layer, { opacity: 1, filter: 'blur(0px)', scale: 1 }, { opacity: 0, filter: 'blur(26px)', scale: 1.06, duration: 0.24, ease: 'power2.in', immediateRender: false }, at);
          }

          tl.fromTo(['#h-l1', '#h-l2', '#h-tag', '#h-spark'], { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, S0 - 0.12);

          /* ================= five skills ================= */
          SK.forEach(function (cfg, k) {
            var B = S0 + k * SEC, sc = $('#s' + (k + 1));
            bursts(B);

            /* A · #N and the command */
            var hs = $('.numrow .hs', sc), nn = splitLetters($('.numrow .nn', sc)), cmdL = splitLetters($('.cmd .lw', sc)), bot = $('.numbot', sc);
            tl.fromTo(hs, { opacity: 0, scale: 0.6, filter: 'blur(12px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.3, ease: 'expo.out', immediateRender: false }, B + 0.025);
            lettersIn(tl, nn, B + 0.2, 140, null, 0.05);
            lettersIn(tl, cmdL, B + 0.409, 220, null, 0.35);
            popIn(tl, bot, B + 0.818, 0.5, 60);
            bob(tl, bot, B + 1.2, B + 1.8, 10);
            flash(B + 1.72, $('.va', sc));

            /* B · lead line, card, chip on its wire, mascot perched on the card */
            var card = $('.card', sc), chip = $('.chip', sc), wire = $('.wire path', sc), perch = $('.perch', sc);
            wordsIn(tl, $$('.vb .lead.small:not(.pay-s) .w', sc), B + 1.95, 0.24);
            lettersIn(tl, splitLetters($('.vb .lead.big:not(.pay-b) .lw', sc)), B + 2.35, 260, null, 0.4);
            tl.fromTo(card, { opacity: 0, y: 90, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'expo.out', immediateRender: false }, B + 2.0);
            tl.set(wire, { opacity: 0 }, 0);
            tl.fromTo(wire, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, B + 3.1);
            popIn(tl, chip, B + 2.998, 0.7, cfg.pos === 'before' ? -30 : 30);
            popIn(tl, perch, B + 3.3, 0.6, 40);
            bob(tl, perch, B + 3.7, B + 5.8, 8);
            wordsIn(tl, $$('.pay-s .w', sc), B + 3.75, 0.22);
            lettersIn(tl, splitLetters($('.pay-b .lw', sc)), B + 4.36, 240, null, 0.4);
            flash(B + 5.75, $('.vb', sc));

            /* slow drift keeps the reading holds alive */
            tl.fromTo($('.vb', sc), { y: 0 }, { y: -26, duration: 3.9, ease: 'none', immediateRender: false }, B + 1.9);
            tl.fromTo($('.vc', sc), { y: 0 }, { y: -26, duration: 2.8, ease: 'none', immediateRender: false }, B + 5.9);

            /* C · follow-up */
            var f = cfg.follow;
            if (f.type === 'pills') {
              var fps = $$('.fp', sc);
              popIn(tl, fps[0], B + 6.0, 0.8, 30);
              popIn(tl, fps[1], B + 6.35, 0.8, 30);
              wordsIn(tl, $$('.vc .lead.small .w', sc), B + 6.95, 0.16);
              lettersIn(tl, splitLetters($('.vc .lead.big .lw', sc)), B + 7.4, 240, null, 0.35);
            } else {
              tl.fromTo($('.holder', sc), { opacity: 0, y: -200 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', immediateRender: false }, B + 6.0);
              tl.fromTo($('.disc', sc), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out', immediateRender: false }, B + 6.05);
              tl.fromTo($('.doc', sc), { opacity: 0, x: 420, rotation: 6 }, { opacity: 1, x: 0, rotation: 0, duration: 0.6, ease: 'expo.out', immediateRender: false }, B + 6.0);
              tl.fromTo($('.doc', sc), { y: 0 }, { y: -120, duration: 2.5, ease: 'none', immediateRender: false }, B + 6.2);
              $$('.li', sc).forEach(function (li, i) {
                tl.fromTo(li, { opacity: 0, x: -30, filter: 'blur(10px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.35, ease: 'power3.out', immediateRender: false }, B + 6.6 + i * 0.5);
              });
            }
            tl.fromTo($('.vc', sc), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: 'power2.in', immediateRender: false }, B + SEC - 0.2);
          });

          /* ================= END CARD ================= */
          var E = END;
          tl.fromTo('#pill', { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, E - 0.2);
          tl.fromTo('#e-logo', { opacity: 0, scale: 0.85, filter: 'blur(16px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out', immediateRender: false }, E + 0.05);
          $$('#e-title .lw').forEach(function (el, i) { lettersIn(tl, splitLetters(el), E + 0.35 + i * 0.2, 200, '#ffffff', 0.4); });
          tl.fromTo('#e-cta', { opacity: 0, scale: 0.7, xPercent: -50 }, { opacity: 1, scale: 1, xPercent: -50, duration: 0.4, ease: 'back.out(1.8)', immediateRender: false }, E + 1.15);
          tl.set('#e-cta', { xPercent: -50 }, 0);
          tl.fromTo('#e-url', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, E + 1.4);
          $$('#e-crew img').forEach(function (im, i) {
            tl.fromTo(im, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, E + 1.7 + i * 0.06);
            tl.set(im, { opacity: 0 }, 0);
            bob(tl, im, E + 2.4 + (i % 2) * 0.136, TOTAL - 1.7, 8);   // the last 1.7 s hold still
          });
          tl.fromTo('#e-cta', { scale: 1 }, { scale: 1.06, duration: 0.16, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, E + 2.6);

          tl.set({}, {}, TOTAL);
          window.__timelines = window.__timelines || {};
          window.__timelines['main'] = tl;
          return true;
        });
      })();
    </script>
  </body>
</html>
