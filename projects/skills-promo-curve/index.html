      (function () {
        var $ = function (s, r) { return (r || document).querySelector(s); };
        var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
        var TOTAL = 31;

        /* ================= the curve engine =================
           One coral bezier with K cubic segments. Every shape is K+1 anchors, so any shape can morph into any other. */
        var K = 16, PI = Math.PI;
        var seed = 23;
        function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
        function anchors(fn) { var A = []; for (var i = 0; i <= K; i++) A.push(fn(i / K, i)); return A; }
        function smooth(A) {       // Catmull-Rom through the anchors
          var P = [A[0]];
          for (var i = 0; i < K; i++) {
            var p0 = A[i - 1] || A[i], p1 = A[i], p2 = A[i + 1], p3 = A[i + 2] || A[i + 1];
            P.push([p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6], p2);
          }
          return P;
        }
        function sharp(A) {
          var P = [A[0]];
