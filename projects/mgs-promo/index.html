    <script>
      (function () {
        var $ = function (s) { return document.querySelector(s); };
        var ENV = [0.794, 1.0, 0.728, 0.197, 0.769, 0.754, 0.717, 0.916, 0.831, 0.651, 0.483, 0.359, 0.749, 0.521, 0.648, 0.809, 0.84, 0.862, 0.913, 0.772, 0.628, 0.906, 0.73, 0.519, 0.61, 0.188, 0.784, 0.768, 0.408, 0.428, 0.703, 0.537, 0.65, 0.827, 0.798, 0.633];
        var SCRIPT = [
          'شايف الموشن هذا؟',
          'تقدر تسوي زيه بدون ما تفتح <span class="lat">After Effects</span>',
          'جهزت لك <span class="lat">Skill</span> تخلي <span class="lat">Claude Code</span> يبني الموشن معك',
          'من الفكرة لين الرندر',
          'ومعها <span class="lat">Skill</span> تكتب لك السكربت',
          'و<span class="lat">Skill</span> تسوي لك الـ<span class="lat">Voice Over</span>',
          'ولسه فيه أكثر',
          'جايب لك عرض قوي على <span class="lat">Claude Code</span> نفسه',
          'اترك لي تعليق وراح أرسل لك كل شيء'
        ];
        var CMD = 'npx skills add\nimMamdouhaboammar/\nmotion-graphics-skills';

        function ready() {
          var imgs = Array.prototype.slice.call(document.images).map(function (im) {
            return im.decode ? im.decode().catch(function () {}) : Promise.resolve();
          });
          var faces = ['500 40px TSans', '700 40px TSans', '900 40px TSerif', '500 40px JBMono'].map(function (f) {
            return document.fonts.load(f, 'الموشن Ae');
          });
          var bgs = ['assets/tex/paper-fibre.png', 'assets/tex/stamp-ink.png', 'assets/tex/grain-0.png', 'assets/tex/grain-1.png', 'assets/tex/grain-2.png'].map(function (u) {
            var i = new Image(); i.src = u; return i.decode().catch(function () {});
          });
          return Promise.all(faces.concat(imgs, bgs)).then(function () { return document.fonts.ready; });
        }

        // word rise: the word waits fully below its mask AND hidden, so nothing peeks through the
        // mask's descender padding before its cue
        function rise(tl, sel, at, dur, from) {
          tl.set(sel, { opacity: 0 }, 0);
          tl.set(sel, { opacity: 1 }, at);
          tl.fromTo(sel, { yPercent: from == null ? 130 : from, filter: 'blur(6px)' }, { yPercent: 0, filter: 'blur(0px)', duration: dur || 0.34, ease: 'power2.out', immediateRender: false }, at);
        }

        window.__ready = ready().then(function () {
          var tl = gsap.timeline({ paused: true });

          /* ================= B1 · 0.00–1.50 ================= */
          var W = $('#b1-word'), N = 5, H = 440 / N, OFF = [-360, 250, -150, 430, -230];
          for (var i = 0; i < N; i++) {
            var s = document.createElement('div');
            // each slice shows one strip of the word by design; clip-audit declares it an intentional crop from tools/
            s.className = 'b1-slice'; s.setAttribute('data-layout-allow-overflow', '');
            s.style.top = i * H + 'px'; s.style.height = H + 'px';
            s.innerHTML = '<div class="ar serif" style="top:' + -i * H + 'px">الموشن</div>';
            W.appendChild(s);
            tl.fromTo(s, { x: OFF[i] }, { x: 0, duration: 0.5 + i * 0.04, ease: 'expo.out' }, 0.02 + (i % 2) * 0.03);
          }
          rise(tl, '#b1-q .m > span', 0.83, 0.3);
