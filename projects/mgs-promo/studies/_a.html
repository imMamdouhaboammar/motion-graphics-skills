<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
  <div class="scene night clip" id="b1" data-start="0" data-duration="1.5" data-track-index="1">
    <div class="abs" id="strip-rot" style="left:-200px;top:700px;width:1480px;height:420px;transform:rotate(-4deg)">
      <div id="strip" style="position:absolute;left:0;top:0;width:4200px;height:420px;background:var(--cream);display:flex;align-items:center;gap:40px;padding:0 20px;box-shadow:0 18px 40px rgba(0,0,0,.5)">
      </div>
    </div>
    <div class="abs ar" id="q" style="left:0;right:0;top:1180px;text-align:center;font-family:TSerif;font-weight:900;font-size:150px;color:var(--clay)">هذا؟</div>
  </div>
  __B2__
</div>
<script>
document.fonts.ready.then(()=>{
  const strip=document.getElementById('strip');
  for(let i=0;i<9;i++){const f=document.createElement('div');f.style.cssText='flex:0 0 420px;height:300px;background:var(--night);border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden';
    if(i===4){f.innerHTML='<div class="ar" style="font-family:TSerif;font-weight:900;font-size:130px;color:var(--cream);line-height:1">الموشن</div>';f.style.background='var(--clay)'}
    strip.appendChild(f)}
  const tl=gsap.timeline({paused:true});
  // strip races in right->left and locks with frame 5 centred
  const lockX=-(4*460)+530;
  tl.fromTo(strip,{x:lockX-2600,filter:'blur(18px)'},{x:lockX,filter:'blur(0px)',duration:0.38,ease:'expo.out'},0);
  tl.fromTo('#q',{yPercent:60,opacity:0},{yPercent:0,opacity:1,duration:0.3,ease:'power2.out'},0.83);
  tl.fromTo('#ae',{y:120,opacity:0},{y:0,opacity:1,duration:0.4,ease:'power3.out'},1.55);
  window.__timelines["main"]=tl;
});
</script>
</body></html>
